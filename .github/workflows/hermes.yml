name: hermes-cloud
on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hermes-cloud
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: hermes-pip-3.12-v1

      - name: Restore profile state
        run: |
          mkdir -p "$GITHUB_WORKSPACE/state/hermes"
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin state --depth 1
            # state branch stores profile at hermes-home/<rel> → restore into workspace state/hermes
            git archive origin/state hermes-home 2>/dev/null | tar -x --strip-components=1 -C "$GITHUB_WORKSPACE/state/hermes" || true
            echo "state restored from origin/state"
            ls -la "$GITHUB_WORKSPACE/state/hermes" | head -5 || true
          else
            echo "no state branch — first boot"
          fi

      - name: Install Hermes Agent
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Start state pusher (background)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HERMES_HOME: ${{ github.workspace }}/state/hermes
        run: |
          mkdir -p "$HERMES_HOME"
          nohup python3 push_state.py > push_state.log 2>&1 &
          echo "pusher started"

      - name: Run Hermes Gateway (4h45m window)
        env:
          RUN_MINUTES: "267"
          HERMES_HOME: ${{ github.workspace }}/state/hermes
          ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
        run: |
          chmod +x run_hermes.sh bootstrap_profile.sh
          ./run_hermes.sh

# schedule re-registration touch
